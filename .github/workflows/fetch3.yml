name: fetch033
on:
  push:
    branches: [relay033]
  workflow_dispatch:
jobs:
  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name qiaogh97
          git config user.email qiaogh97@users.noreply.github.com
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/qiaogh97/testGit.git
          git checkout --orphan prog6 2>/dev/null || git checkout prog6 2>/dev/null || true
          echo "whittaker 720p relay v9 $(date)" > s1.txt && git add s1.txt && git commit -q -m s1 && git push -qf origin prog6 || true
      - name: stream transcode first 25 min to 720p
        run: |
          set +e
          ffmpeg -y -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 30 -i "https://archive.org/download/mnn_883581_222/883581_222.m4v" -t 1500 -vf scale=1280:720 -c:v libx264 -crf 21 -preset fast -c:a aac -b:a 128k whittaker_720p.mp4
          echo "ffmpeg exit=$?"
          ls -la whittaker_720p.mp4 2>/dev/null
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of default=nw=1 whittaker_720p.mp4 2>&1 | head -8
          exit 0
      - name: split into 15MB chunks and push to git
        run: |
          set +e
          if [ ! -s whittaker_720p.mp4 ]; then
            echo "NO_VIDEO" > fail.txt
            git add fail.txt && git commit -q -m fail && git push -q origin prog6
            exit 0
          fi
          split -b 15m -d whittaker_720p.mp4 w7.
          ls w7.* | wc -l
          for f in w7.*; do
            [ -f "$f" ] || continue
            git add "$f" && git commit -q -m "add $f"
            for try in 1 2 3 4; do
              git push -q origin prog6 && break
              echo "push $f try$try failed"; sleep 15
            done
          done
          echo git_parts_done > gitdone.txt
          git add gitdone.txt && git commit -q -m gitdone && git push -q origin prog6
          echo GIT_PARTS_DONE
          exit 0
      - name: slow uguu upload of chunks
        run: |
          set +e
          for f in w7.*; do
            [ -f "$f" ] || continue
            u=""
            for try in 1 2 3 4 5 6 7 8; do
              resp=$(curl -s -m 300 -F "files[]=@$f" https://uguu.se/upload.php)
              u=$(echo "$resp" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['files'][0]['url'])" 2>/dev/null)
              [ -n "$u" ] && break
              echo "$f try$try resp: $(echo "$resp" | head -c 150)"
              sleep 45
            done
            echo "$f -> ${u:-FAILED}"
            fn=$(echo "$f" | tr '/.' '__')
            echo "${u:-FAILED}" > "url_$fn.txt"
            git add "url_$fn.txt" && git commit -q -m "url $f" && git push -q origin prog6 || true
            sleep 30
          done
          echo done > done.txt
          git add done.txt && git commit -q -m done && git push -q origin prog6
          echo RELAY_V9_DONE
          exit 0
