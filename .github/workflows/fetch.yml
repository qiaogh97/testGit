name: fetch
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name qiaogh97
          git config user.email qiaogh97@users.noreply.github.com
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/qiaogh97/testGit.git
          git fetch origin prog4 2>/dev/null || true
          git checkout prog4 2>/dev/null || git checkout --orphan prog4
      - name: download 70MB parts via range requests
        run: |
          TOTAL=2071238227
          PSIZE=73400320
          N=$(( (TOTAL + PSIZE - 1) / PSIZE ))
          echo "total=$TOTAL parts=$N"
          seq 0 $((N-1)) | xargs -P 4 -I{} bash -c '
            i={}
            TOTAL=2071238227
            PSIZE=73400320
            start=$((i*PSIZE))
            end=$((start+PSIZE-1))
            [ $end -ge $TOTAL ] && end=$((TOTAL-1))
            for try in 1 2 3 4 5 6; do
              curl -sL --retry 3 -m 570 -r ${start}-${end} -o part_$(printf %02d $i) "https://archive.org/download/mnn_883581_222/883581_222.m4v"
              sz=$(stat -c%s part_$(printf %02d $i))
              want=$((end-start+1))
              [ "$sz" = "$want" ] && exit 0
              echo "part $i try$try size=$sz want=$want"
            done
            exit 1
          '
          ls -la part_* | wc -l
      - name: push parts to git in batches
        run: |
          for s in 0 5 10 15 20 25; do
            e=$((s+4))
            added=0
            for i in $(seq $s $e); do
              id=$(printf %02d $i)
              [ -f "part_$id" ] || continue
              git add "part_$id" && added=$((added+1))
            done
            [ "$added" -gt 0 ] || continue
            git commit -q -m "parts $s-$e"
            for try in 1 2 3; do
              git push -q origin prog4 && break
              echo "push batch $s try$try failed, retrying"
              sleep 20
            done
          done
          echo done > done.txt
          git add done.txt && git commit -q -m done && git push -q origin prog4
          echo GIT_RELAY_DONE
