name: fetch
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: download sources
        run: |
          set -x
          curl -sL --retry 3 -o soken.mkv "https://archive.org/download/youtube-B8xZo5XhLlA/B8xZo5XhLlA.mkv"
          sha1sum soken.mkv
          curl -sL --retry 3 -o maumet.webm "https://commons.wikimedia.org/wiki/Special:FilePath/Entretien_avec_Camille_Maumet_Neuroimagerie_et_sciences_ouvertes.webm"
          ls -la maumet.webm
          sha1sum maumet.webm
          split -b 70m -d maumet.webm maumet.webm.
          ls -la
      - name: upload parts to uguu
        run: |
          set -x
          : > urls.txt
          for f in soken.mkv maumet.webm.*; do
            u=""
            for try in 1 2 3; do
              u=$(curl -s -m 600 -F "files[]=@$f" https://uguu.se/upload.php | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['files'][0]['url'])" 2>/dev/null)
              [ -n "$u" ] && break
              sleep 3
            done
            echo "$f $u" >> urls.txt
          done
          cat urls.txt
      - name: push data branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          git config user.name qiaogh97
          git config user.email qiaogh97@users.noreply.github.com
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/qiaogh97/testGit.git
          git fetch origin data2 2>/dev/null || true
          git checkout --orphan data2 2>/dev/null || git checkout data2
          git rm -rf . >/dev/null 2>&1 || true
          cp urls.txt . 2>/dev/null || echo "urls.txt missing" > urls.txt
          git add urls.txt
          git commit -m "urls $(date +%s)"
          git push -f origin data2
